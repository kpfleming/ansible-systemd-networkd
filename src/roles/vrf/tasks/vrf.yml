---
- name: manage network device for VRF
  become: true
  register: _netdev
  notify: "{{ ansible_role_name ~ ' : reload' }}"
  ansible.builtin.template:
    src: vrf.netdev.j2
    dest: "{{ systemd_root ~ '/etc/systemd/network/' ~ vrf.name ~ '.netdev' }}"
    lstrip_blocks: true
    mode: u=rw,g=r,o=
    group: systemd-network

- name: set fact to indicate result
  ansible.builtin.set_fact:
    systemd_networkd_vrf_changed: "{{ systemd_networkd_vrf_changed|default(false) or _netdev.changed }}"
